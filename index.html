<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafi's Mini Arcade</title>
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<div class="starfield" aria-hidden="true"></div>
<header class="site-header">
  <h1>RAFI'S <span class="neon">MINI&nbsp;ARCADE</span></h1>
  <p class="tagline">Pick a game. Beat your best.</p>
</header>

<main class="cards">
  <article class="card featured">
    <div class="thumb">
      <svg viewBox="0 0 300 150" role="img" aria-label="Police Chase thumbnail">
        <rect width="300" height="150" fill="#0b0b18"/>
        <g fill="#1e2a4a">
          <rect x="52" y="10" width="10" height="22"/><rect x="52" y="60" width="10" height="22"/><rect x="52" y="110" width="10" height="22"/>
          <rect x="238" y="25" width="10" height="22"/><rect x="238" y="75" width="10" height="22"/><rect x="238" y="125" width="10" height="22"/>
        </g>
        <rect x="90" y="0" width="120" height="150" fill="#23232e"/>
        <rect x="87" y="0" width="3" height="150" fill="#22d3ee"/>
        <rect x="210" y="0" width="3" height="150" fill="#e879f9"/>
        <g fill="rgba(255,255,255,0.55)">
          <rect x="128" y="6" width="4" height="26"/><rect x="128" y="56" width="4" height="26"/><rect x="128" y="106" width="4" height="26"/>
          <rect x="168" y="6" width="4" height="26"/><rect x="168" y="56" width="4" height="26"/><rect x="168" y="106" width="4" height="26"/>
        </g>
        <g>
          <rect x="100" y="16" width="26" height="42" fill="#3b82f6"/>
          <rect x="104" y="24" width="18" height="8" fill="#0f172a"/>
          <rect x="104" y="52" width="18" height="6" fill="#1e3a8a"/>
        </g>
        <g>
          <rect x="140" y="44" width="28" height="46" fill="#ef2d2d"/>
          <rect x="150" y="44" width="8" height="46" fill="#f8fafc"/>
          <rect x="144" y="52" width="20" height="9" fill="#0f172a"/>
          <rect x="144" y="72" width="20" height="8" fill="#7f1d1d"/>
          <rect x="142" y="86" width="7" height="4" fill="#fef9c3"/>
          <rect x="159" y="86" width="7" height="4" fill="#fef9c3"/>
        </g>
        <g>
          <rect x="140" y="102" width="28" height="44" fill="#111827"/>
          <rect x="140" y="118" width="28" height="12" fill="#f8fafc"/>
          <rect x="144" y="108" width="20" height="8" fill="#0f172a"/>
          <rect x="142" y="98" width="11" height="6" fill="#ef4444"/>
          <rect x="155" y="98" width="11" height="6" fill="#3b82f6"/>
          <rect x="142" y="142" width="6" height="4" fill="#ef4444"/>
          <rect x="160" y="142" width="6" height="4" fill="#ef4444"/>
        </g>
      </svg>
    </div>
    <h2>Police Chase</h2>
    <p class="desc">Outrun the cops, dodge the traffic. How long can you survive?</p>
    <p class="best">BEST <span id="best-police">0</span></p>
    <a class="play-btn" href="police-chase/">PLAY</a>
  </article>
</main>

<footer>
  <p>Scores are saved on this device · More games coming soon</p>
</footer>
<script src="arcade.js"></script>
</body>
</html>
